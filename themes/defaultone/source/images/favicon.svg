<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a2e"/>

  <!-- hair back -->
  <ellipse cx="32" cy="28" rx="18" ry="20" fill="#d4813a"/>

  <!-- left twintail -->
  <ellipse cx="13" cy="30" rx="5" ry="13" fill="#d4813a" transform="rotate(-15 13 30)"/>
  <!-- right twintail -->
  <ellipse cx="51" cy="30" rx="5" ry="13" fill="#d4813a" transform="rotate(15 51 30)"/>

  <!-- face -->
  <ellipse cx="32" cy="31" rx="13" ry="14" fill="#fde8d0"/>

  <!-- hair front -->
  <ellipse cx="32" cy="20" rx="14" ry="10" fill="#d4813a"/>
  <!-- fringe -->
  <path d="M20 22 Q24 14 32 16 Q40 14 44 22 Q40 18 32 19 Q24 18 20 22Z" fill="#c97030"/>

  <!-- eyes -->
  <ellipse cx="25" cy="31" rx="4" ry="4.5" fill="#5aafff"/>
  <ellipse cx="39" cy="31" rx="4" ry="4.5" fill="#5aafff"/>
  <!-- eye shine -->
  <circle cx="26.5" cy="29.5" r="1.2" fill="white"/>
  <circle cx="40.5" cy="29.5" r="1.2" fill="white"/>
  <!-- pupils -->
  <ellipse cx="25" cy="31.5" rx="2.5" ry="3" fill="#1a3a6e"/>
  <ellipse cx="39" cy="31.5" rx="2.5" ry="3" fill="#1a3a6e"/>

  <!-- eyebrows -->
  <path d="M21 26 Q25 24 29 26" stroke="#c97030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 26 Q39 24 43 26" stroke="#c97030" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <circle cx="32" cy="36" r="0.8" fill="#e8b898"/>

  <!-- mouth -->
  <path d="M28 40 Q32 43 36 40" stroke="#e06060" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- hair clips (blue) -->
  <rect x="12" y="24" width="5" height="3" rx="1.5" fill="#5aafff"/>
  <rect x="47" y="24" width="5" height="3" rx="1.5" fill="#5aafff"/>

  <!-- collar/bow -->
  <path d="M26 45 Q32 48 38 45 L36 50 Q32 52 28 50Z" fill="#e8e8e8"/>
  <path d="M29 47 Q32 45 35 47 L33 49 Q32 50 31 49Z" fill="#cc3333"/>
</svg>
