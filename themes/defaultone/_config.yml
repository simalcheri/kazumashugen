# INJECT >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
inject:
  enable: true
  head: 
    - <style>* { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='28' y1='2' x2='6' y2='28' stroke='%23c8a96e' stroke-width='3' stroke-linecap='round'/><line x1='6' y1='28' x2='2' y2='30' stroke='%23c8a96e' stroke-width='2' stroke-linecap='round'/><line x1='28' y1='2' x2='24' y2='6' stroke='%23f0d090' stroke-width='2' stroke-linecap='round'/><circle cx='28' cy='2' r='2' fill='%23f0d090'/></svg>") 2 30, auto; }</style>
    -
  footer:
    - <script>
        (function() {
          const kanji = ['愛','夢','花','風','月','星','空','海','心','魂','桜','光','水','火','雪','力','美','詩','歌','道'];
          const particles = [];
          const canvas = document.createElement('canvas');
          canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;';
          document.body.appendChild(canvas);
          const ctx = canvas.getContext('2d');
          function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
          resize();
          window.addEventListener('resize', resize);
          document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.4) return;
            particles.push({
              x: e.clientX,
              y: e.clientY,
              char: kanji[Math.floor(Math.random() * kanji.length)],
              size: Math.random() * 14 + 10,
              opacity: 1,
              speedY: -(Math.random() * 1.5 + 0.5),
              speedX: (Math.random() - 0.5) * 1.2,
              color: ['#c8a96e','#f0d090','#e8c870','#ffd700','#ffb7c5'][Math.floor(Math.random()*5)]
            });
          });
          function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.y += p.speedY;
              p.x += p.speedX;
              p.opacity -= 0.018;
              ctx.save();
              ctx.globalAlpha = p.opacity;
              ctx.fillStyle = p.color;
              ctx.font = `bold ${p.size}px serif`;
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 8;
              ctx.fillText(p.char, p.x, p.y);
              ctx.restore();
              if (p.opacity <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
          }
          animate();
        })();
      </script>
    -
# INJECT <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


